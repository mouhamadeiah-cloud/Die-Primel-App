<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover">
<title>Die Primel POS - V4</title>
<style>
    :root {
        --green: #27ae60; --blue: #2980b9; --orange: #f39c12;
        --red: #c0392b; --dark: #2c3e50; --gray: #95a5a6; --light: #ecf0f1;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { margin: 0; background: var(--light); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header {
        background: var(--dark); color: white; padding: 0 4vw;
        display: flex; justify-content: space-between; align-items: center;
        height: 70px; flex-shrink: 0;
    }
    .header-left, .header-right { display: flex; gap: 10px; align-items: center; }
    header h2 { font-size: 1.5rem; }
    header button {
        padding: 8px 16px; border: none; border-radius: 8px;
        font-weight: bold; cursor: pointer; color: white;
        font-size: 0.9rem;
    }
    .btn-kitchen { background: var(--green); }
    .btn-tables { background: var(--orange); }
    .btn-admin { background: var(--blue); }
    .btn-customer { background: #9b59b6; }
    .btn-waiter { background: #ff5722; }
    main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    #menu-container { flex: 2; padding: 2vh 2vw; overflow-y: auto; background: #dfe4ea; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2vh 2vw; margin-bottom: 2vh; }
    .card { background: white; padding: 2vh 1vw; text-align: center; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; transition: transform 0.1s; display: flex; flex-direction: column; gap: 8px; }
    .cat-card { background: var(--blue); color: white; }
    .prod-price { color: var(--green); font-weight: bold; margin: 5px 0; }
    .recipe-btn { background: var(--orange); color: white; border: none; border-radius: 20px; padding: 8px; font-size: 0.8rem; cursor: pointer; width: 100%; }
    #cart-container { flex: 1; background: white; display: flex; flex-direction: column; padding: 2vh 2vw; border-left: 2px solid #ccc; overflow: hidden; }
    .cart-items { flex: 1; overflow-y: auto; margin-bottom: 1vh; }
    .cart-item { border: 1px solid #ddd; padding: 1vh 2vw; margin-bottom: 0.8vh; border-radius: 10px; }
    .cart-item.locked { background: #f8f9fa; color: #95a5a6; border-left: 5px solid var(--gray); }
    .cart-item.new { background: #fff; border-left: 5px solid var(--blue); }
    .cart-item-main { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .cart-item-name { font-weight: bold; flex: 2; min-width: 100px; }
    .cart-item-quantity { color: var(--orange); background: #fef5e8; padding: 2px 8px; border-radius: 20px; }
    .cart-item-total-price { color: var(--green); font-weight: bold; }
    .action-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-sm { border: none; padding: 5px 12px; border-radius: 20px; color: white; font-size: 0.75rem; cursor: pointer; }
    .btn-sm-qty { background: var(--green); }
    .btn-sm-qty-minus { background: var(--orange); }
    .btn-sm-extra { background: var(--orange); }
    .btn-sm-note { background: var(--blue); }
    .btn-sm-del { background: var(--red); }
    .cart-total-bar { background: var(--dark); color: white; padding: 1.5vh 2vw; border-radius: 10px; text-align: center; font-weight: bold; margin-top: 1vh; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; overflow-y: auto; backdrop-filter: blur(3px); }
    .modal-content { background: white; width: 90%; max-width: 500px; margin: 10vh auto; padding: 2rem; border-radius: 20px; max-height: 80vh; overflow-y: auto; position: relative; }
    .close { position: absolute; top: 15px; right: 20px; font-size: 32px; cursor: pointer; color: var(--red); background: none; border: none; }
    .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px; margin: 20px 0; }
    .table-btn { padding: 15px 0; background: var(--blue); color: white; border: none; border-radius: 12px; font-size: 1.3rem; cursor: pointer; }
    .table-btn.selected { background: var(--green); transform: scale(1.05); }
    .admin-list { max-height: 50vh; overflow-y: auto; margin-top: 2vh; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 1vh; background: #fff; border-radius: 6px; margin-bottom: 0.5vh; flex-wrap: wrap; }
    .admin-item-actions { display: flex; gap: 5px; }
    .btn-up, .btn-down, .btn-edit, .btn-delete { border: none; padding: 5px 10px; border-radius: 4px; color: white; cursor: pointer; }
    .btn-up { background: var(--green); }
    .btn-down { background: var(--orange); }
    .btn-edit { background: var(--blue); }
    .btn-delete { background: var(--red); }
    .input-group { display: flex; gap: 1vw; margin-bottom: 2vh; flex-wrap: wrap; }
    .input-group input, .input-group select, .input-group textarea { flex: 1 1 140px; padding: 1vh; border: 1px solid #ddd; border-radius: 8px; }
    .btn-main { width: 100%; padding: 2vh; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 1vh; color: white; background: var(--green); }
    .fab-mic { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; border-radius: 50%; background: #e74c3c; color: white; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .fab-mic.recording { animation: pulse 1s infinite; background: #ff0000; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .toast-message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 10px 20px; border-radius: 30px; z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast-message.show { opacity: 1; }
    .kitchen-order-card { background: white; color: #333; border-radius: 12px; padding: 2vh; margin-bottom: 1vh; border: 5px solid transparent; }
    .late-blink { animation: kitchen-blink 1s infinite; }
    @keyframes kitchen-blink { 0% { border-color: transparent; } 50% { border-color: #ff3b30; } 100% { border-color: transparent; } }
    .voice-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .voice-content { background: white; border-radius: 28px; width: 90%; max-width: 450px; padding: 24px; }
    .voice-search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .voice-search-box input { flex: 1; padding: 14px; border: 2px solid var(--blue); border-radius: 16px; }
    .voice-mic-small { width: 52px; height: 52px; border-radius: 50%; background: #e74c3c; color: white; border: none; font-size: 22px; cursor: pointer; }
    .voice-result { background: #f0f8ff; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .voice-actions { display: flex; gap: 12px; }
    .voice-actions button { flex: 1; padding: 14px; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; }
    .btn-add { background: var(--green); color: white; }
    .btn-close { background: var(--red); color: white; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
<div id="toast" class="toast-message"></div>
<header>
    <div class="header-left">
        <button class="btn-kitchen" onclick="openKitchen()">KÜCHE</button>
        <button class="btn-tables" onclick="openTables()">TISCHE</button>
    </div>
    <h2>DIE PRIMEL</h2>
    <div class="header-right">
        <button class="btn-admin" onclick="showLoginModal()">ADMIN</button>
        <button class="btn-customer" onclick="openCustomerPage()">KUNDEN</button>
        <button class="btn-waiter" onclick="callWaiter()">🔔 RUF</button>
    </div>
</header>
<main>
    <section id="menu-container">
        <h3>Kategorien</h3>
        <div id="cat-grid" class="grid"></div>
        <hr><h3>Produkte</h3>
        <div id="prod-grid" class="grid"></div>
    </section>
    <section id="cart-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="cart-title">Warenkorb</h2>
            <button onclick="clearNewCartOnly()" style="background:var(--red); color:white; border:none; padding:5px 10px; border-radius:5px;">NEUE LÖSCHEN</button>
        </div>
        <div id="cart-list" class="cart-items"></div>
        <div id="cart-total-bar" class="cart-total-bar">0.00 €</div>
        <button class="btn-main" onclick="initiateSend()">BESTELLUNG SENDEN</button>
    </section>
</main>
<button id="fab-mic" class="fab-mic" title="Sprachbestellung">🎤</button>

<!-- Modals -->
<div id="modal-login" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-login')">&times;</button><h2>Admin Login</h2><div class="pin-display" id="pin-display"></div><div class="pin-pad" id="pin-pad"></div><div class="pin-footer"><button class="btn-clear" onclick="clearPin()">Löschen</button><button class="btn-ok" onclick="submitPin()">OK</button></div></div></div>
<div id="modal-admin" class="modal"><div class="modal-content"><div class="admin-header"><h1>Admin</h1><button class="close" onclick="closeModal('modal-admin')">&times;</button></div><div class="admin-tabs"><button class="admin-tab-btn active" data-tab="categories">Kategorien</button><button class="admin-tab-btn" data-tab="products">Produkte</button><button class="admin-tab-btn" data-tab="extras">Extras</button><button class="admin-tab-btn" data-tab="zutaten">Zutaten</button></div><div class="admin-body"><div id="admin-categories-section" class="admin-section active"><div class="admin-card"><h3>Kategorien</h3><div class="input-group"><input type="text" id="new-cat-name" placeholder="Name"><button onclick="addCategory()">+</button></div><div id="admin-cat-list" class="admin-list"></div></div></div><div id="admin-products-section" class="admin-section"><div class="admin-card"><h3>Produkte</h3><select id="admin-prod-filter" onchange="renderProductsAdmin()"></select><div class="input-group"><input type="text" id="p-name" placeholder="Name"><input type="number" id="p-price" placeholder="Preis"><input type="text" id="p-image" placeholder="Bild-URL"><select id="p-cat-select"></select><button onclick="addProduct()">+</button></div><div id="admin-product-list" class="admin-list"></div></div></div><div id="admin-extras-section" class="admin-section"><div class="admin-card"><h3>Extras</h3><div class="input-group"><input type="text" id="ex-name" placeholder="Name"><input type="number" id="ex-price" placeholder="Preis"><button onclick="addExtra('extra')">+</button></div><div id="admin-ex-list" class="admin-list"></div></div></div><div id="admin-zutaten-section" class="admin-section"><div class="admin-card"><h3>Zutaten</h3><div class="input-group"><input type="text" id="zut-name" placeholder="Name"><input type="number" id="zut-price" placeholder="Preis"><button onclick="addExtra('zutat')">+</button></div><div id="admin-zut-list" class="admin-list"></div></div></div></div></div></div>
<div id="modal-table-grid" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-table-grid')">&times;</button><h2>Tisch auswählen</h2><div id="selected-table-display" class="selected-display">Kein Tisch</div><div id="table-grid" class="table-grid"></div><div class="modal-footer"><button class="btn-cancel" onclick="closeModal('modal-table-grid')">Abbrechen</button><button class="btn-confirm" onclick="confirmTableSelection()">Bestätigen</button><button class="btn-confirm" onclick="selectTakeaway()">Takeaway</button></div></div></div>
<div id="modal-show-order" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-show-order')">&times;</button><h2 id="show-order-title">Bestellung</h2><div id="show-order-items"></div><div id="show-order-total"></div><div style="display:flex; gap:10px;"><button class="btn-main" style="background:var(--red)" onclick="confirmDeleteTable()">Löschen</button><button class="btn-main" style="background:var(--blue)" onclick="closeModal('modal-show-order')">Schließen</button></div></div></div>
<div id="modal-tables" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-tables')">&times;</button><h2>AKTIVE TISCHE</h2><div id="tables-grid" class="grid"></div><button class="btn-main" style="background:var(--blue)" onclick="closeModal('modal-tables')">Schließen</button></div></div>
<div id="modal-extras" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-extras')">&times;</button><h3 id="extras-modal-title">Extras</h3><div id="extras-grid"></div></div></div>
<div id="modal-note" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-note')">&times;</button><h3>Notiz für <span id="note-item-name"></span></h3><div style="position:relative;"><textarea id="note-text-input" rows="4" style="width:100%; padding:2vh; border-radius:10px; padding-right:45px;"></textarea><button id="note-mic-btn" style="position:absolute; bottom:10px; right:10px; background:#e74c3c; color:white; border:none; border-radius:50%; width:35px; height:35px; font-size:18px; cursor:pointer;">🎤</button></div><button class="btn-main" style="background:var(--green)" onclick="saveNote()">SPEICHERN</button></div></div>
<div id="modal-kitchen" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-kitchen')">&times;</button><h1>KÜCHE</h1><div id="kitchen-content" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:15px;"></div></div></div>
<div id="modal-confirm" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-confirm')">&times;</button><h3 id="confirm-message">Sicher?</h3><div class="confirm-actions"><button class="btn-confirm" onclick="executeConfirm()">Ja</button><button class="btn-cancel" onclick="closeModal('modal-confirm')">Nein</button></div></div></div>
<div id="modal-edit" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-edit')">&times;</button><h3 id="edit-title">Bearbeiten</h3><input type="text" id="edit-input" style="width:100%; padding:12px; margin:10px 0;"><input type="number" id="edit-price" style="display:none; width:100%; padding:12px;"><input type="text" id="edit-image" style="display:none; width:100%; padding:12px;"><textarea id="edit-description" rows="4" style="display:none; width:100%;"></textarea><textarea id="edit-recipe-ingredients" rows="4" style="display:none; width:100%;"></textarea><textarea id="edit-recipe-instructions" rows="6" style="display:none; width:100%;"></textarea><div style="display:flex; gap:10px;"><button class="btn-confirm" onclick="saveEdit()">Speichern</button><button class="btn-cancel" onclick="closeModal('modal-edit')">Abbrechen</button></div></div></div>
<div id="modal-extra-type" class="modal"><div class="modal-content"><button class="close" onclick="closeModal('modal-extra-type')">&times;</button><h2>Extra Typ</h2><div class="extra-type-grid"><button class="extra-type-btn extras" onclick="selectExtraType('extras')">Extras</button><button class="extra-type-btn zutaten" onclick="selectExtraType('zutaten')">Zutaten</button></div></div></div>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyCjHwRY3J7KHr4DaX15mWfXvrGUleJk32Q",
    authDomain: "primelpos.firebaseapp.com",
    databaseURL: "https://primelpos-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "primelpos",
    storageBucket: "primelpos.firebasestorage.app",
    appId: "1:151403014246:web:d88248fa3e2505b7dda5a7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Sound & Toast
const KITCHEN_SOUND_URL = 'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3';
const WAITER_SOUND_URL = 'https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3';
function playSound(url) { new Audio(url).play().catch(e=>console.log(e)); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
db.ref('notifications/waiter').on('value',snap=>{if(snap.val()?.timestamp) playSound(WAITER_SOUND_URL);});
db.ref('notifications/kitchen').on('value',snap=>{if(snap.val()?.timestamp) playSound(KITCHEN_SOUND_URL);});

// Data
let categories = JSON.parse(localStorage.getItem('cats')) || [];
let products = JSON.parse(localStorage.getItem('prods')) || [];
let extras = JSON.parse(localStorage.getItem('extras')) || [];
let zutaten = JSON.parse(localStorage.getItem('zutaten')) || [];
let cartNew = [], cartLocked = [], activeTable = null;
let currentItemIdx, currentNoteIdx, selectedTable, confirmCallback, editContext={}, currentShowTable, currentPin='';

function ensureOrders() {
    categories = categories.map((c,i)=>{if(c.order===undefined)c.order=i; return c;});
    products = products.map((p,i)=>{if(p.order===undefined)p.order=i; p.imageUrl=p.imageUrl||''; p.description=p.description||''; p.recipeIngredients=p.recipeIngredients||''; p.recipeInstructions=p.recipeInstructions||''; return p;});
    extras = extras.map((e,i)=>{if(e.order===undefined)e.order=i; return e;});
    zutaten = zutaten.map((z,i)=>{if(z.order===undefined)z.order=i; return z;});
}
function openModal(id){document.getElementById(id).style.display='block';}
function closeModal(id){document.getElementById(id).style.display='none';}
function save(){localStorage.setItem('cats',JSON.stringify(categories));localStorage.setItem('prods',JSON.stringify(products));localStorage.setItem('extras',JSON.stringify(extras));localStorage.setItem('zutaten',JSON.stringify(zutaten)); db.ref('data').set({categories,products,extras,zutaten});}
function loadFromFirebase(){db.ref('data').once('value',snap=>{if(snap.val()){categories=snap.val().categories||[];products=snap.val().products||[];extras=snap.val().extras||[];zutaten=snap.val().zutaten||[];} ensureOrders(); renderCats(); if(categories.length)renderProds(categories[0].id);});}

// Render
function renderCats(){const grid=document.getElementById('cat-grid'); if(!grid)return; const sorted=[...categories].sort((a,b)=>(a.order||0)-(b.order||0)); grid.innerHTML=sorted.map(c=>`<div class="card cat-card" onclick="renderProds(${c.id})">${c.name}</div>`).join(''); const sel=document.getElementById('p-cat-select'); if(sel)sel.innerHTML=categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');}
function renderProds(cid){const grid=document.getElementById('prod-grid'); if(!grid)return; const sorted=products.filter(p=>p.catId==cid).sort((a,b)=>(a.order||0)-(b.order||0)); grid.innerHTML=sorted.map(p=>`<div class="card prod-card"><div onclick="addToCart(${p.id})">${p.name}</div><div class="prod-price" onclick="addToCart(${p.id})">${p.price.toFixed(2)}€</div><button class="recipe-btn" onclick="event.stopPropagation(); showRecipe(${p.id})">📖 Rezept</button></div>`).join('');}
function showRecipe(pid){const p=products.find(p=>p.id==pid); if(!p)return; alert(`Rezept für ${p.name}\nZutaten: ${p.recipeIngredients||'-'}\nZubereitung: ${p.recipeInstructions||'-'}`);} // simplified

function renderCart(){const list=document.getElementById('cart-list'); if(!list)return; let total=0,html=''; cartLocked.forEach(item=>{let p=item.price+(item.selectedExtras?item.selectedExtras.reduce((s,e)=>s+e.price,0):0); total+=p*(item.quantity||1); html+=`<div class="cart-item locked"><div><span>${item.name} x${item.quantity||1}</span><span>${(p*(item.quantity||1)).toFixed(2)}€</span></div>${item.selectedExtras?.length?`<div>+${item.selectedExtras.map(e=>e.name).join(',')}</div>`:''}${item.note?`<div>📝${item.note}</div>`:''}</div>`;}); cartNew.forEach((item,idx)=>{let unit=item.price+(item.selectedExtras?item.selectedExtras.reduce((s,e)=>s+e.price,0):0); let qty=item.quantity||1; let itemTotal=unit*qty; total+=itemTotal; html+=`<div class="cart-item new"><div class="cart-item-main"><span class="cart-item-name">${item.name}</span><span class="cart-item-quantity">x${qty}</span><span class="cart-item-total-price">${itemTotal.toFixed(2)}€</span></div>${item.note?`<div>📝${item.note}</div>`:''}${item.selectedExtras?.length?`<div>+${item.selectedExtras.map(e=>e.name).join(',')}</div>`:''}<div class="action-btns"><button class="btn-sm btn-sm-qty" onclick="changeQty(${idx},1)">+1</button><button class="btn-sm btn-sm-qty-minus" onclick="changeQty(${idx},-1)">-1</button><button class="btn-sm btn-sm-extra" onclick="openExtraTypeSelector(${idx})">Extra</button><button class="btn-sm btn-sm-note" onclick="addNote(${idx})">Note</button><button class="btn-sm btn-sm-del" onclick="removeFromCart(${idx})">X</button></div></div>`;}); list.innerHTML=html; document.getElementById('cart-total-bar').innerText=total.toFixed(2)+' €'; document.getElementById('cart-title').innerHTML=activeTable?(activeTable==='takeaway'?'🥡 Takeaway':'Tisch '+activeTable):'Warenkorb';}

function addToCart(pid){const p=products.find(i=>i.id==pid); if(p) cartNew.push({...p,tempId:Date.now()+Math.random(),selectedExtras:[],note:'',quantity:1}); renderCart();}
function changeQty(i,d){if(cartNew[i]){cartNew[i].quantity=(cartNew[i].quantity||1)+d; if(cartNew[i].quantity<=0)cartNew.splice(i,1); renderCart();}}
function removeFromCart(i){cartNew.splice(i,1); renderCart();}
function clearNewCartOnly(){if(cartNew.length) showConfirm('Neue Artikel löschen?',()=>{cartNew=[]; renderCart();}); else showToast('Keine neuen Artikel');}
function resetCart(){cartNew=[]; cartLocked=[]; activeTable=null; renderCart();}

// Table Handling
async function updateTablesGrid(){const grid=document.getElementById('tables-grid'); if(!grid)return; const snap=await db.ref('active_orders').once('value'); const data=snap.val()||{}; let html=''; for(let [table,batches] of Object.entries(data)){let batchCount=Object.keys(batches).length; let lastTime=''; let lastKey=Object.keys(batches).pop(); if(lastKey&&batches[lastKey].time)lastTime=batches[lastKey].time; html+=`<div class="table-box"><h3>${table==='takeaway'?'🥡 Takeaway':'Tisch '+table}</h3><small>${batchCount} Best. | ${lastTime}</small><div><button onclick="closeModal('modal-tables'); showOrderFromFirebase('${table}')">Show</button><button onclick="closeModal('modal-tables'); addToExistingTable('${table}')" style="background:var(--green)">Zufügen</button><button onclick="closeModal('modal-tables'); confirmDeleteTableFromCard('${table}')" style="background:var(--red)">Löschen</button></div></div>`;} grid.innerHTML=html||'Keine aktiven Tische';}
async function addToExistingTable(tableId){const snap=await db.ref('active_orders/'+tableId).once('value'); const batches=snap.val(); cartLocked=[]; if(batches){Object.values(batches).forEach(b=>{if(b.items) b.items.forEach(i=>cartLocked.push({...i}));});} activeTable=tableId; cartNew=[]; renderCart(); showToast(`Tisch ${tableId} geladen, neue Bestellung möglich`);}
async function showOrderFromFirebase(tableId){const snap=await db.ref('active_orders/'+tableId).once('value'); const batches=snap.val(); if(!batches){showToast('Keine Bestellungen');return;} let items='',total=0; Object.values(batches).forEach(b=>{if(b.items) b.items.forEach(i=>{let price=i.price+(i.selectedExtras?i.selectedExtras.reduce((s,e)=>s+e.price,0):0); let qty=i.quantity||1; total+=price*qty; items+=`<div>${i.name} x${qty} ${i.selectedExtras?.map(e=>e.name).join(',')||''}</div>`; if(i.note) items+=`<div style="color:red">📝${i.note}</div>`;})}); document.getElementById('show-order-items').innerHTML=items; document.getElementById('show-order-total').innerText=total.toFixed(2)+'€'; document.getElementById('show-order-title').innerText=tableId==='takeaway'?'🥡 Takeaway':'Tisch '+tableId; currentShowTable=tableId; openModal('modal-show-order');}
function confirmDeleteTableFromCard(tableId){currentShowTable=tableId; showConfirm(`Tisch ${tableId} löschen?`,async()=>{await db.ref('active_orders/'+tableId).remove(); if(activeTable===tableId)resetCart(); showToast(`Tisch ${tableId} gelöscht`); updateTablesGrid();});}
function confirmDeleteTable(){if(!currentShowTable)return; showConfirm(`Tisch ${currentShowTable} löschen?`,async()=>{await db.ref('active_orders/'+currentShowTable).remove(); if(activeTable===currentShowTable)resetCart(); closeModal('modal-show-order'); updateTablesGrid();});}
function initiateSend(){if(cartNew.length===0) return alert('Keine neuen Artikel'); if(activeTable) confirmOrder(); else{updateFreeTablesDisplay(); openModal('modal-table-grid');}}
async function confirmOrder(){const tNum=activeTable; if(!tNum)return; const newBatch={batchId:Date.now(),time:new Date().toLocaleTimeString(),date:new Date().toLocaleDateString(),items:[...cartNew],status:'new'}; await db.ref('active_orders/'+tNum).push(newBatch); await db.ref('notifications/kitchen').set({timestamp:Date.now()}); cartLocked.push(...cartNew.map(i=>({...i}))); cartNew=[]; renderCart(); showToast(`Bestellung für ${tNum} gesendet`); closeModal('modal-table-grid');}
function createTableGrid(){const g=document.getElementById('table-grid'); if(!g)return; let h=''; for(let i=1;i<=20;i++) h+=`<button class="table-btn" onclick="selectTable(${i})">${i}</button>`; g.innerHTML=h;}
function selectTable(num){document.querySelectorAll('#table-grid .table-btn').forEach(b=>b.classList.remove('selected')); event.target.classList.add('selected'); selectedTable=num; document.getElementById('selected-table-display').innerText='Tisch '+num;}
function selectTakeaway(){document.querySelectorAll('#table-grid .table-btn').forEach(b=>b.classList.remove('selected')); selectedTable='takeaway'; document.getElementById('selected-table-display').innerText='🥡 Takeaway';}
function confirmTableSelection(){if(!selectedTable){alert('Bitte Tisch wählen');return;} activeTable=selectedTable; closeModal('modal-table-grid'); confirmOrder();}
function updateFreeTablesDisplay(){db.ref('active_orders').once('value',snap=>{const occupied=[]; snap.forEach(ts=>{if(ts.key!=='takeaway') occupied.push(ts.key);}); document.querySelectorAll('#table-grid .table-btn').forEach(btn=>{if(occupied.includes(btn.textContent)) btn.style.display='none'; else btn.style.display='inline-block';});});}
function openTables(){updateTablesGrid(); openModal('modal-tables');}
function openCustomerPage(){window.open('kunden.html','_blank');}
function callWaiter(){db.ref('notifications/waiter').set({timestamp:Date.now()}); playSound(WAITER_SOUND_URL); showToast('🔔 Kellner gerufen');}

// Extras & Notes
function openExtraTypeSelector(idx){currentItemIdx=idx; openModal('modal-extra-type');}
function selectExtraType(type){closeModal('modal-extra-type'); showExtrasList(type==='extras'?extras:zutaten,type);}
function showExtrasList(list,type){const g=document.getElementById('extras-grid'); document.getElementById('extras-modal-title').innerText=type==='extras'?'Extras':'Zutaten'; g.innerHTML=list.map(e=>`<div class="card" onclick="selectExtra(${e.id},'${type}')">${e.name}<br>+${e.price.toFixed(2)}€</div>`).join(''); openModal('modal-extras');}
function selectExtra(eid,type){let ex=(type==='zutat')?zutaten.find(e=>e.id==eid):extras.find(e=>e.id==eid); if(ex){cartNew[currentItemIdx].selectedExtras.push(ex); renderCart();} closeModal('modal-extras');}
function addNote(idx){currentNoteIdx=idx; const item=cartNew[idx]; if(item){document.getElementById('note-item-name').innerText=item.name; document.getElementById('note-text-input').value=item.note||''; openModal('modal-note');}}
function saveNote(){const txt=document.getElementById('note-text-input').value; if(currentNoteIdx!==null&&cartNew[currentNoteIdx]){cartNew[currentNoteIdx].note=txt; renderCart();} closeModal('modal-note');}

// Voice Note Mic
let noteRecognition=null;
function startVoiceNoteRecording(){if(!('webkitSpeechRecognition'in window)){showToast('❌ Nicht unterstützt');return;} const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; if(noteRecognition)try{noteRecognition.stop();}catch(e){} noteRecognition=new SpeechRecognition(); noteRecognition.lang='de-DE'; noteRecognition.continuous=false; noteRecognition.interimResults=false; noteRecognition.onstart=()=>{const btn=document.getElementById('note-mic-btn'); if(btn){btn.innerHTML='🔴';btn.style.background='#ff0000';} showToast('🎤 Sprechen...');}; noteRecognition.onresult=(e)=>{const transcript=e.results[0][0].transcript; const ta=document.getElementById('note-text-input'); if(ta) ta.value=ta.value?ta.value+' '+transcript:transcript; showToast('📝 Notiz hinzugefügt');}; noteRecognition.onerror=()=>{const btn=document.getElementById('note-mic-btn'); if(btn){btn.innerHTML='🎤';btn.style.background='#e74c3c';}}; noteRecognition.onend=()=>{const btn=document.getElementById('note-mic-btn'); if(btn){btn.innerHTML='🎤';btn.style.background='#e74c3c';}}; try{noteRecognition.start();}catch(e){showToast('❌ Mikrofon Fehler');}}
document.getElementById('note-mic-btn')?.addEventListener('click',startVoiceNoteRecording);

// Voice Search (FAB)
function showVoiceModal(){const existing=document.querySelector('.voice-modal'); if(existing)existing.remove(); const modalHtml=`<div class="voice-modal"><div class="voice-content"><div class="voice-search-box"><input id="voice-search-input" placeholder="Gericht sagen..."><button id="voice-search-mic" class="voice-mic-small">🎤</button></div><div id="voice-result-container"><div class="voice-result"><h3>🎤 Spracheingabe</h3></div></div><div class="voice-actions"><button id="voice-add-btn" class="btn-add" disabled>➕ Hinzufügen</button><button id="voice-close-btn" class="btn-close">❌ Schließen</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend',modalHtml); const searchInput=document.getElementById('voice-search-input'); const searchMic=document.getElementById('voice-search-mic'); const addBtn=document.getElementById('voice-add-btn'); const closeBtn=document.getElementById('voice-close-btn'); let currentProduct=null; function findProduct(text){const t=text.toLowerCase(); let best=null, bestScore=0; for(let p of products){let score=0; if(p.name.toLowerCase()===t) score=100; else if(p.name.toLowerCase().includes(t)) score=90; else if(t.includes(p.name.toLowerCase())) score=85; else{let match=0; for(let ch of t) if(p.name.toLowerCase().includes(ch)) match++; score=Math.min(70,Math.round(match/p.name.length*70));} if(score>bestScore){bestScore=score; best=p;}} return bestScore>=40?best:null;} function updateUI(){const text=searchInput.value.trim(); const prod=findProduct(text); currentProduct=prod; const container=document.getElementById('voice-result-container'); if(prod){container.innerHTML=`<div class="voice-result"><div class="product-name">${prod.name}</div><div class="price">${prod.price.toFixed(2)}€</div></div>`; addBtn.disabled=false;}else{container.innerHTML=`<div class="voice-result"><div>❌ Kein Produkt gefunden</div></div>`; addBtn.disabled=true;}} searchInput.addEventListener('input',updateUI); let voiceRecog=null; function startVoiceSearch(){if(!('webkitSpeechRecognition'in window)){showToast('❌ Nicht unterstützt');return;} const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; if(voiceRecog)try{voiceRecog.stop();}catch(e){} voiceRecog=new SpeechRecognition(); voiceRecog.lang='de-DE'; voiceRecog.continuous=false; voiceRecog.interimResults=false; voiceRecog.onstart=()=>{searchMic.innerHTML='🔴';searchMic.style.background='#ff0000';showToast('🎤 Höre zu...');}; voiceRecog.onresult=(e)=>{searchInput.value=e.results[0][0].transcript; updateUI(); searchMic.innerHTML='🎤';searchMic.style.background='#e74c3c';}; voiceRecog.onerror=()=>{searchMic.innerHTML='🎤';searchMic.style.background='#e74c3c';}; voiceRecog.onend=()=>{searchMic.innerHTML='🎤';searchMic.style.background='#e74c3c';}; try{voiceRecog.start();}catch(e){showToast('❌ Mikrofon Fehler');}} searchMic.addEventListener('click',startVoiceSearch); addBtn.addEventListener('click',()=>{if(currentProduct){cartNew.push({...currentProduct,tempId:Date.now()+Math.random(),selectedExtras:[],note:'',quantity:1}); renderCart(); showToast(`✅ ${currentProduct.name} hinzugefügt`); document.querySelector('.voice-modal').remove();}}); closeBtn.addEventListener('click',()=>document.querySelector('.voice-modal').remove());}
document.getElementById('fab-mic')?.addEventListener('click',showVoiceModal);

// Admin
function showLoginModal(){currentPin=''; updatePinDisplay(); openModal('modal-login');}
function updatePinDisplay(){document.getElementById('pin-display').textContent=currentPin.padStart(4,'•');}
function addPinDigit(d){if(currentPin.length<4){currentPin+=d; updatePinDisplay();}}
function clearPin(){currentPin=''; updatePinDisplay();}
function submitPin(){if(currentPin==='1234'){closeModal('modal-login'); openAdmin();}else{showToast('Falscher PIN'); clearPin();}}
function createPinPad(){const pad=document.getElementById('pin-pad'); pad.innerHTML=''; for(let i=1;i<=9;i++){const b=document.createElement('button'); b.className='pin-btn'; b.textContent=i; b.onclick=()=>addPinDigit(i.toString()); pad.appendChild(b);} const b0=document.createElement('button'); b0.className='pin-btn'; b0.textContent='0'; b0.onclick=()=>addPinDigit('0'); pad.appendChild(b0); const e=document.createElement('button'); e.className='pin-btn'; e.style.visibility='hidden'; pad.appendChild(e);}
function openAdmin(){renderCats(); const filter=document.getElementById('admin-prod-filter'); if(filter)filter.innerHTML='<option value="all">Alle</option>'+categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join(''); switchAdminTab('categories'); renderCategoriesAdmin(); renderProductsAdmin(); renderExtrasAdmin(); renderZutatenAdmin(); openModal('modal-admin');}
function switchAdminTab(tabId){document.querySelectorAll('.admin-tab-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active')); document.querySelector(`.admin-tab-btn[data-tab="${tabId}"]`).classList.add('active'); document.getElementById(`admin-${tabId}-section`).classList.add('active');}
document.querySelectorAll('.admin-tab-btn').forEach(btn=>btn.addEventListener('click',()=>{const tab=btn.getAttribute('data-tab'); switchAdminTab(tab); if(tab==='categories')renderCategoriesAdmin(); else if(tab==='products')renderProductsAdmin(); else if(tab==='extras')renderExtrasAdmin(); else if(tab==='zutaten')renderZutatenAdmin();}));
function renderCategoriesAdmin(){const cont=document.getElementById('admin-cat-list'); if(!cont)return; const sorted=[...categories].sort((a,b)=>(a.order||0)-(b.order||0)); cont.innerHTML=sorted.map(c=>`<div class="admin-item"><span>${c.name}</span><div class="admin-item-actions"><button class="btn-up" onclick="moveUp('category',${c.id})">↑</button><button class="btn-down" onclick="moveDown('category',${c.id})">↓</button><button class="btn-edit" onclick="openEditModal('category',${c.id})">Edit</button><button class="btn-delete" onclick="confirmDelete('category',${c.id})">X</button></div></div>`).join('');}
function renderProductsAdmin(){const cont=document.getElementById('admin-product-list'); if(!cont)return; const filter=document.getElementById('admin-prod-filter'); const catId=filter?filter.value:'all'; let filtered=catId==='all'?products:products.filter(p=>p.catId==catId); const sorted=[...filtered].sort((a,b)=>(a.order||0)-(b.order||0)); cont.innerHTML=sorted.map(p=>`<div class="admin-item"><div><strong>${p.name}</strong> ${p.price.toFixed(2)}€</div><div class="admin-item-actions"><button class="btn-up" onclick="moveUp('product',${p.id})">↑</button><button class="btn-down" onclick="moveDown('product',${p.id})">↓</button><button class="btn-edit" onclick="openEditModal('product',${p.id})">Edit</button><button class="btn-delete" onclick="confirmDelete('product',${p.id})">X</button></div></div>`).join('');}
function renderExtrasAdmin(){const cont=document.getElementById('admin-ex-list'); if(!cont)return; const sorted=[...extras].sort((a,b)=>(a.order||0)-(b.order||0)); cont.innerHTML=sorted.map(e=>`<div class="admin-item"><span>${e.name} (+${e.price.toFixed(2)}€)</span><div class="admin-item-actions"><button class="btn-up" onclick="moveUp('extra',${e.id})">↑</button><button class="btn-down" onclick="moveDown('extra',${e.id})">↓</button><button class="btn-edit" onclick="openEditModal('extra',${e.id})">Edit</button><button class="btn-delete" onclick="confirmDelete('extra',${e.id})">X</button></div></div>`).join('');}
function renderZutatenAdmin(){const cont=document.getElementById('admin-zut-list'); if(!cont)return; const sorted=[...zutaten].sort((a,b)=>(a.order||0)-(b.order||0)); cont.innerHTML=sorted.map(z=>`<div class="admin-item"><span>${z.name} (+${z.price.toFixed(2)}€)</span><div class="admin-item-actions"><button class="btn-up" onclick="moveUp('zutat',${z.id})">↑</button><button class="btn-down" onclick="moveDown('zutat',${z.id})">↓</button><button class="btn-edit" onclick="openEditModal('zutat',${z.id})">Edit</button><button class="btn-delete" onclick="confirmDelete('zutat',${z.id})">X</button></div></div>`).join('');}
function addCategory(){const name=document.getElementById('new-cat-name').value.trim(); if(name){const maxOrder=categories.reduce((m,c)=>Math.max(m,c.order||0),-1)+1; categories.push({id:Date.now(),name,order:maxOrder}); save(); renderCats(); renderCategoriesAdmin(); document.getElementById('new-cat-name').value='';}}
function addProduct(){const name=document.getElementById('p-name').value.trim(); const price=parseFloat(document.getElementById('p-price').value); const cat=parseInt(document.getElementById('p-cat-select').value); const img=document.getElementById('p-image').value.trim(); if(name&&!isNaN(price)&&price>=0){const maxOrder=products.filter(p=>p.catId==cat).reduce((m,p)=>Math.max(m,p.order||0),-1)+1; products.push({id:Date.now(),catId:cat,name,price,order:maxOrder,imageUrl:img,description:'',recipeIngredients:'',recipeInstructions:''}); save(); renderProductsAdmin(); renderProds(cat); document.getElementById('p-name').value=''; document.getElementById('p-price').value=''; document.getElementById('p-image').value='';}}
function addExtra(type){let name,price; if(type==='extra'){name=document.getElementById('ex-name').value.trim(); price=parseFloat(document.getElementById('ex-price').value);}else{name=document.getElementById('zut-name').value.trim(); price=parseFloat(document.getElementById('zut-price').value);} if(name&&!isNaN(price)&&price>=0){const arr=type==='extra'?extras:zutaten; const maxOrder=arr.reduce((m,e)=>Math.max(m,e.order||0),-1)+1; const newItem={id:Date.now(),name,price,order:maxOrder}; if(type==='extra'){extras.push(newItem); renderExtrasAdmin(); document.getElementById('ex-name').value=''; document.getElementById('ex-price').value='';}else{zutaten.push(newItem); renderZutatenAdmin(); document.getElementById('zut-name').value=''; document.getElementById('zut-price').value='';} save();}}
async function moveUp(type,id){let arr, getOrder, setOrder; if(type==='category'){arr=categories; getOrder=c=>c.order; setOrder=(c,o)=>c.order=o;}else if(type==='product'){arr=products; getOrder=p=>p.order; setOrder=(p,o)=>p.order=o;}else if(type==='extra'){arr=extras; getOrder=e=>e.order; setOrder=(e,o)=>e.order=o;}else if(type==='zutat'){arr=zutaten; getOrder=z=>z.order; setOrder=(z,o)=>z.order=o;}else return; const sorted=[...arr].sort((a,b)=>(getOrder(a)||0)-(getOrder(b)||0)); const idx=sorted.findIndex(i=>i.id===id); if(idx<=0)return; const temp=getOrder(sorted[idx]); setOrder(sorted[idx],getOrder(sorted[idx-1])); setOrder(sorted[idx-1],temp); const reSorted=[...arr].sort((a,b)=>(getOrder(a)||0)-(getOrder(b)||0)); reSorted.forEach((item,i)=>setOrder(item,i)); save(); if(type==='category'){renderCategoriesAdmin(); renderCats();}else if(type==='product'){renderProductsAdmin(); if(categories[0])renderProds(categories[0].id);}else if(type==='extra')renderExtrasAdmin(); else if(type==='zutat')renderZutatenAdmin();}
async function moveDown(type,id){let arr, getOrder, setOrder; if(type==='category'){arr=categories; getOrder=c=>c.order; setOrder=(c,o)=>c.order=o;}else if(type==='product'){arr=products; getOrder=p=>p.order; setOrder=(p,o)=>p.order=o;}else if(type==='extra'){arr=extras; getOrder=e=>e.order; setOrder=(e,o)=>e.order=o;}else if(type==='zutat'){arr=zutaten; getOrder=z=>z.order; setOrder=(z,o)=>z.order=o;}else return; const sorted=[...arr].sort((a,b)=>(getOrder(a)||0)-(getOrder(b)||0)); const idx=sorted.findIndex(i=>i.id===id); if(idx>=sorted.length-1)return; const temp=getOrder(sorted[idx]); setOrder(sorted[idx],getOrder(sorted[idx+1])); setOrder(sorted[idx+1],temp); const reSorted=[...arr].sort((a,b)=>(getOrder(a)||0)-(getOrder(b)||0)); reSorted.forEach((item,i)=>setOrder(item,i)); save(); if(type==='category'){renderCategoriesAdmin(); renderCats();}else if(type==='product'){renderProductsAdmin(); if(categories[0])renderProds(categories[0].id);}else if(type==='extra')renderExtrasAdmin(); else if(type==='zutat')renderZutatenAdmin();}
function openEditModal(type,id){editContext={type,id}; let item=null; if(type==='category')item=categories.find(c=>c.id===id); else if(type==='product')item=products.find(p=>p.id===id); else if(type==='extra')item=extras.find(e=>e.id===id); else if(type==='zutat')item=zutaten.find(z=>z.id===id); if(!item)return; document.getElementById('edit-title').innerText=type==='category'?'Kategorie bearbeiten':(type==='product'?'Produkt bearbeiten':(type==='extra'?'Extra bearbeiten':'Zutat bearbeiten')); document.getElementById('edit-input').value=item.name; const priceInp=document.getElementById('edit-price'); const imgInp=document.getElementById('edit-image'); const descInp=document.getElementById('edit-description'); const ingInp=document.getElementById('edit-recipe-ingredients'); const insInp=document.getElementById('edit-recipe-instructions'); priceInp.style.display='none'; imgInp.style.display='none'; descInp.style.display='none'; ingInp.style.display='none'; insInp.style.display='none'; if(type==='product'){priceInp.style.display='block'; priceInp.value=item.price; imgInp.style.display='block'; imgInp.value=item.imageUrl||''; descInp.style.display='block'; descInp.value=item.description||''; ingInp.style.display='block'; ingInp.value=item.recipeIngredients||''; insInp.style.display='block'; insInp.value=item.recipeInstructions||'';}else if(type==='extra'||type==='zutat'){priceInp.style.display='block'; priceInp.value=item.price;} openModal('modal-edit');}
function saveEdit(){const newName=document.getElementById('edit-input').value.trim(); if(!newName)return alert('Name leer'); const type=editContext.type, id=editContext.id; if(type==='category'){const cat=categories.find(c=>c.id===id); if(cat){cat.name=newName; save(); renderCats(); renderCategoriesAdmin();}}else if(type==='product'){const newPrice=parseFloat(document.getElementById('edit-price').value); if(isNaN(newPrice))return alert('Preis ungültig'); const newImg=document.getElementById('edit-image').value.trim(); const newDesc=document.getElementById('edit-description').value; const newIng=document.getElementById('edit-recipe-ingredients').value; const newIns=document.getElementById('edit-recipe-instructions').value; const prod=products.find(p=>p.id===id); if(prod){prod.name=newName; prod.price=newPrice; prod.imageUrl=newImg; prod.description=newDesc; prod.recipeIngredients=newIng; prod.recipeInstructions=newIns; save(); cartNew=cartNew.map(i=>i.id===prod.id?{...i,name:prod.name,price:prod.price,imageUrl:prod.imageUrl,description:prod.description}:i); cartLocked=cartLocked.map(i=>i.id===prod.id?{...i,name:prod.name,price:prod.price,imageUrl:prod.imageUrl,description:prod.description}:i); renderCart(); renderProductsAdmin(); if(prod.catId)renderProds(prod.catId);}}else if(type==='extra'){const newPrice=parseFloat(document.getElementById('edit-price').value); if(isNaN(newPrice))return; const extra=extras.find(e=>e.id===id); if(extra){extra.name=newName; extra.price=newPrice; save(); renderExtrasAdmin();}}else if(type==='zutat'){const newPrice=parseFloat(document.getElementById('edit-price').value); if(isNaN(newPrice))return; const zut=zutaten.find(z=>z.id===id); if(zut){zut.name=newName; zut.price=newPrice; save(); renderZutatenAdmin();}} closeModal('modal-edit');}
function confirmDelete(type,id){let msg=''; if(type==='category')msg='Kategorie löschen?'; else if(type==='product')msg='Produkt löschen?'; else if(type==='extra')msg='Extra löschen?'; else msg='Zutat löschen?'; showConfirm(msg,()=>{if(type==='category'){categories=categories.filter(c=>c.id!==id); save(); renderCats(); renderCategoriesAdmin();}else if(type==='product'){products=products.filter(p=>p.id!==id); save(); renderProductsAdmin(); if(categories[0])renderProds(categories[0].id);}else if(type==='extra'){extras=extras.filter(e=>e.id!==id); save(); renderExtrasAdmin();}else{zutaten=zutaten.filter(z=>z.id!==id); save(); renderZutatenAdmin();}});}
function openKitchen(){openModal('modal-kitchen'); const container=document.getElementById('kitchen-content'); container.innerHTML='<h2>Lade...</h2>'; db.ref('active_orders').on('value',snap=>{const data=snap.val(); if(!data){container.innerHTML='<h1>KEINE BESTELLUNGEN</h1>';return;} let orders=[]; Object.entries(data).forEach(([tNum,batches])=>{Object.entries(batches).forEach(([bId,batch])=>{orders.push({tableNum:tNum,batchId:bId,time:batch.time||'',timestamp:batch.batchId||0,items:batch.items||[],isLate:(Date.now()-(batch.batchId||0))>300000});});}); orders.sort((a,b)=>b.timestamp-a.timestamp); let html=''; orders.forEach(o=>{html+=`<div class="kitchen-order-card ${o.isLate?'late-blink':''}"><div><b>${o.tableNum==='takeaway'?'🥡 TAKEAWAY':'TISCH '+o.tableNum}</b> <span>${o.time}</span></div><div>${o.items.map(i=>`<div><b>${i.name}</b> x${i.quantity||1} ${i.selectedExtras?.map(e=>e.name).join(',')||''} ${i.note?`<span style="color:red">📝${i.note}</span>`:''}</div>`).join('')}</div><button class="btn-main" style="background:green" onclick="finishOrder('${o.tableNum}','${o.batchId}')">FERTIG</button></div>`;}); container.innerHTML=html||'<h1>Keine</h1>';});}
function finishOrder(tNum,bId){db.ref('active_orders/'+tNum+'/'+bId).remove();}
function showConfirm(msg,cb){document.getElementById('confirm-message').innerText=msg; confirmCallback=cb; openModal('modal-confirm');}
function executeConfirm(){if(confirmCallback){confirmCallback(); confirmCallback=null;} closeModal('modal-confirm');}

// Init
function init(){ensureOrders(); renderCats(); if(categories.length)renderProds(categories[0].id); renderCart(); createTableGrid(); createPinPad(); loadFromFirebase();}
init();
</script>
